flags_to_verify:
  - "PRoPE (paper's ADOPTED camera encoding) is implemented in source (prope.py:52-140) but NOT activated on shipped inference (worldfm_infer.py never passes use_prope/prope_viewmats/prope_Ks); unclear if released weights were trained with PRoPE and the modulation is merely bypassed, or camera conditioning is effectively absent in the public model."
  - "Plucker (compared alternative) implemented (plucker.py:8-72) but NOT activated at inference (use_plucker never set)."
  - "Pure-parametric camera injection (3rd strategy) has NO code anywhere in the repo."
  - "cond2 cross-attention alternative branch implemented (PixArtWorldFMMS.py:382-428) but DISABLED (use_cond2_cross_attn=False at worldfm_infer.py:452). Dead branch exists."
  - "Text/caption conditioning fully disabled at inference (disable_cross_attn=True :97; caption_embs zeroed :233,:534) despite PixArt-Sigma T2I lineage."
  - "Internal panorama generative model WITHHELD (README:52-53); shipped path uses HunyuanWorld-1.0 as open-source substitute — may not reproduce paper's 'consistent scene generation'."
  - "All 3 training stages, data curation, and training strategies are paper-only (no train.py/dataset/optimizer); gaussian_diffusion.py:744,857 has inherited training_losses boilerplate but it is NOT wired to any released loop."
  - "cfg_scale: default.yaml sets worldfm.cfg_scale=4.5 (:55) but WorldFMInprocessConfig uses cfg_scale=0.0 for the shipped 1/2-step DMD path (:100); 4.5 applies ONLY to the multi-step DPM teacher (:502). Shipped default step=2 therefore runs at cfg_scale=0.0, not 4.5."
  - "Dataset size, #clips, total frames, model params, training compute, #GPUs, step counts all unstated."
  - "'H-series GPU' not specified to a SKU (e.g. H100); treat ~25 FPS as approximate/hardware-unspecified."
  - "No quantitative metrics (FID/PSNR/LPIPS/consistency) — qualitative only (Figs.4-8); 'minimal perceptual difference' after distillation not numerically substantiated."
  - "MoGe submodule must be checked out at pinned commit (setup.sh); submodules are empty in this checkout — must be initialized before the pipeline runs."
  - "Stage I is described as backbone SELECTION — whether any continued pretraining/finetuning of PixArt-Sigma occurred is unspecified."
  - "depth_selector.py nearest-view defaults are dist_min_m=1.0 / dist_max_m=5.0 (:184-185) — verify whether call sites override dist_max to a larger motion boundary (paper asserts a limited motion boundary, §4.1 p.13)."
